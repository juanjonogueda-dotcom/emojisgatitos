<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colección de Gatitos</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='58' r='34' fill='%231a1a1a'/%3E%3Cpolygon points='16,48 22,18 44,42' fill='%231a1a1a'/%3E%3Cpolygon points='56,42 78,18 84,48' fill='%231a1a1a'/%3E%3Cellipse cx='38' cy='55' rx='5' ry='6' fill='%23f9f9f7'/%3E%3Cellipse cx='62' cy='55' rx='5' ry='6' fill='%23f9f9f7'/%3E%3Cpolygon points='50,66 46,72 54,72' fill='%23f9f9f7'/%3E%3C/svg%3E">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f9f9f7;
      --text:      #1a1a1a;
      --muted:     #aaa;
      --dim:       #777;
      --border:    #e8e8e5;
      --hover-bg:  #f0f0ee;
      --shadow:    rgba(0, 0, 0, 0.06);
      --copied-bg: #e8f5eb;
      --mono:      'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.6;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem 8rem;
    }

    /* ── Header ─────────────────────────────────────────────────────────────── */

    header {
      text-align: center;
      padding: 5.5rem 0 2.5rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 400;
      letter-spacing: -0.01em;
      color: var(--text);
      font-family: Georgia, 'Times New Roman', serif;
    }

    .tagline {
      font-size: 0.71rem;
      color: var(--muted);
      margin-top: 0.45rem;
      letter-spacing: 0.03em;
    }

    /* ── Nav ─────────────────────────────────────────────────────────────────── */

    nav {
      display: flex;
      justify-content: center;
      gap: 1.75rem;
      margin: 1.75rem 0 0;
      flex-wrap: wrap;
    }

    nav a {
      font-size: 0.72rem;
      color: var(--dim);
      text-decoration: none;
      letter-spacing: 0.05em;
      text-transform: lowercase;
      transition: color 0.15s;
      padding-bottom: 2px;
      border-bottom: 1px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }

    nav a:hover,
    nav a.active {
      color: var(--text);
      border-bottom-color: var(--text);
    }

    /* ── Generate button ────────────────────────────────────────────────────── */

    .generate-wrap {
      text-align: center;
      margin: 3rem 0 3.5rem;
    }

    .btn-generate {
      background: var(--text);
      color: var(--bg);
      border: none;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      padding: 0.55rem 1.5rem;
      border-radius: 100px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.12s;
    }

    .btn-generate:hover  { opacity: 0.72; }
    .btn-generate:active { opacity: 0.5; transform: scale(0.97); }

    /* ── Sections ───────────────────────────────────────────────────────────── */

    .section {
      margin-bottom: 3.5rem;
      scroll-margin-top: 2rem;
    }

    .section-label {
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── Grid ───────────────────────────────────────────────────────────────── */

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
    }

    @media (min-width: 560px) {
      .grid { grid-template-columns: repeat(3, 1fr); gap: 0.9rem; }
    }

    @media (min-width: 900px) {
      .grid { grid-template-columns: repeat(4, 1fr); gap: 1rem; }
    }

    /* ── Cards ──────────────────────────────────────────────────────────────── */

    .card {
      padding: 1rem 0.75rem;
      border-radius: 12px;
      cursor: pointer;
      user-select: none;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 140px;
      overflow: hidden;
      transition: background 0.15s, box-shadow 0.15s, transform 0.15s;
      animation: fadeUp 0.38s ease both;
    }

    @media (min-width: 560px) {
      .card { min-height: 175px; padding: 1.25rem 1rem; }
    }

    .card:hover {
      background: var(--hover-bg);
      box-shadow: 0 4px 20px var(--shadow);
      transform: translateY(-2px);
    }

    .card.copied {
      background: var(--copied-bg);
    }

    .card.new {
      animation: pop 0.2s ease-out;
    }

    .card .art {
      font-family: var(--mono);
      font-size: 1rem;
      line-height: 1.3;
      white-space: pre;
      display: block;
      color: var(--text);
      text-align: center;
      transform-origin: center center;
    }

    @media (min-width: 560px) {
      .card .art { font-size: 1.1rem; }
    }

    /* ── Animations ─────────────────────────────────────────────────────────── */

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(0.84); }
      to   { opacity: 1; transform: scale(1); }
    }

    @keyframes fade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card          { animation: none; }
      .card.new      { animation: none; }
      .card:hover    { transform: none; }
      .btn-generate:active { transform: none; }
      .toast         { transition: opacity 0.1s; }
    }

    /* ── Toast ──────────────────────────────────────────────────────────────── */

    .toast {
      position: fixed;
      bottom: 2.25rem;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: var(--text);
      color: var(--bg);
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.07em;
      padding: 0.45rem 1.2rem;
      border-radius: 100px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 900;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Modal ──────────────────────────────────────────────────────────────── */

    .modal {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: zoom-out;
      padding: 2.5rem;
      animation: fade 0.18s ease-out;
    }

    .modal.open { display: flex; }

    .modal-art {
      font-family: var(--mono);
      font-size: clamp(1.1rem, 5vw, 3rem);
      line-height: 1.3;
      white-space: pre;
      color: var(--text);
      text-align: center;
      user-select: text;
    }

    .modal-hint {
      position: absolute;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.67rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    /* ── Hidden by default ──────────────────────────────────────────────────── */

    #sec-generated { display: none; }
    #nav-gen       { display: none; }
  </style>
</head>
<body>

<div class="wrap">

  <header>
    <h1>Colección de Gatitos</h1>
    <p class="tagline">clic para copiar · doble clic para ampliar</p>
    <nav>
      <a href="#sec-generated" id="nav-gen">generados</a>
      <a href="#sec-kaomoji">kaomoji</a>
      <a href="#sec-ascii">ascii</a>
      <a href="#sec-braille">braille</a>

    </nav>
  </header>

  <div class="generate-wrap">
    <button class="btn-generate">generar un gatito</button>
  </div>

  <section class="section" id="sec-generated">
    <p class="section-label">generados</p>
    <div class="grid" id="grid-generated"></div>
  </section>

  <section class="section" id="sec-kaomoji">
    <p class="section-label">kaomoji</p>
    <div class="grid" id="grid-kaomoji"></div>
  </section>

  <section class="section" id="sec-ascii">
    <p class="section-label">ascii</p>
    <div class="grid" id="grid-ascii"></div>
  </section>

  <section class="section" id="sec-braille">
    <p class="section-label">braille</p>
    <div class="grid" id="grid-braille"></div>
  </section>

  <section class="section" id="sec-emoji">
    <p class="section-label">emoji</p>
    <div class="grid" id="grid-emoji"></div>
  </section>

</div>

<div class="toast" id="toast">¡copiado!</div>

<div class="modal" id="modal">
  <pre class="modal-art" id="modal-art"></pre>

// ── Generator ─────────────────────────────────────────────────────────────────

const GEN = {
  eyes:  ['ω','▽','◡','•','‥','ↀ','♡','･','ᴗ','o','ˇ','˘','◕','ᵕ','^','T','>'],
  noses: ['ﻌ','ω','ᆽ','ᴥ','▿','∧','~','^','◇','w','ᗜ','ꞈ'],
  wrappers: [
    ['(=^','  ^=)'],['(^','^)'],['(=','=)'],
    ['≽^','^≼'],['/ᐠ','ᐟ\\'],['₍ᐢ','ᐢ₎'],
    ['ฅ^','^ฅ'],['/ᐠ','ᐡ\\'],['⦃ᐢ','ᐢ⦄'],
    ['ๅ^','^ๅ'],['≽','≼'],
  ],
  pre: ['','','','ฅ','ヾ','ヽ'],
  suf: ['','','','ฅ','ﾉ','丿'],
  tops:  ['  /\\  /\\','  ∧  ∧'],
  eyes2: ['( •  • )','( o  o )','( ^  ^ )','( ◕  ◕ )','( -  - )','( >  < )'],
  noses2:['  (∧)  ','  (ω)  ','  (^)  ','  (~)  '],
  bots:  ['  ( v ) ','  (_v_) ','  (___) ',' >^<    '],
};

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function generate() {
  if (Math.random() < 0.75) {
    const e = pick(GEN.eyes);
    const n = pick(GEN.noses);
    const [wl, wr] = pick(GEN.wrappers);
    const pre = Math.random() < 0.3 ? pick(GEN.pre.filter(Boolean)) : '';
    const suf = Math.random() < 0.3 ? pick(GEN.suf.filter(Boolean)) : '';
    return `${pre}${wl}${e}${n}${e}${wr}${suf}`;
  }
  return `${pick(GEN.tops)}\n${pick(GEN.eyes2)}\n${pick(GEN.noses2)}\n${pick(GEN.bots)}`;
}

// ── Toast ─────────────────────────────────────────────────────────────────────

const toast = document.getElementById('toast');
let toastTimer;

function showToast() {
  clearTimeout(toastTimer);
  toast.classList.add('show');
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1400);
}

// ── Modal ─────────────────────────────────────────────────────────────────────

const modal    = document.getElementById('modal');
const modalArt = document.getElementById('modal-art');

function openModal(text) {
  modalArt.textContent = text;
  modal.classList.add('open');
}
function closeModal() {
  modal.classList.remove('open');
}
modal.addEventListener('click', closeModal);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── Copy ──────────────────────────────────────────────────────────────────────

function copyText(text, card) {
  navigator.clipboard.writeText(text).catch(() => {
    const ta = Object.assign(document.createElement('textarea'), {
      value: text, style: 'position:fixed;opacity:0'
    });
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  });
  document.querySelectorAll('.card.copied').forEach(c => c.classList.remove('copied'));
  card.classList.add('copied');
  setTimeout(() => card.classList.remove('copied'), 1000);
  showToast();
}

// ── Card factory ──────────────────────────────────────────────────────────────

function makeCard(text, animate = false, index = 0) {
  const card = document.createElement('div');
  card.className = 'card' + (animate ? ' new' : '');
  if (!animate) {
    card.style.animationDelay = `${Math.min(index * 38, 560)}ms`;
  }

  const art = document.createElement('span');
  art.className = 'art';
  art.textContent = text;
  card.appendChild(art);

  let clickTimer = null;
  card.addEventListener('click', () => {
    if (clickTimer) {
      clearTimeout(clickTimer);
      clickTimer = null;
      openModal(text);
    } else {
      clickTimer = setTimeout(() => {
        clickTimer = null;
        copyText(text, card);
      }, 240);
    }
  });

  return card;
}

// ── Fit art to card ───────────────────────────────────────────────────────────

function fitArt(card) {
  const art = card.querySelector('.art');
  if (!art) return;
  art.style.transform = '';
  const availW = card.clientWidth  - 24;
  const availH = card.clientHeight - 24;
  if (availW <= 0 || availH <= 0) return;
  const scale = Math.min(1, availW / art.scrollWidth, availH / art.scrollHeight);
  if (scale < 1) art.style.transform = `scale(${scale})`;
}

function fitAll() {
  document.querySelectorAll('.card').forEach(fitArt);
}

// ── Render ────────────────────────────────────────────────────────────────────

function render(key, gridId) {
  const grid = document.getElementById(gridId);
  data[key].forEach((t, i) => grid.appendChild(makeCard(t, false, i)));
}

render('kaomoji', 'grid-kaomoji');
render('ascii',   'grid-ascii');
render('braille', 'grid-braille');
render('emoji',   'grid-emoji');

requestAnimationFrame(fitAll);
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(fitAll, 100);
});

// ── Scroll-spy nav ────────────────────────────────────────────────────────────

const navLinks = document.querySelectorAll('nav a[href^="#sec-"]');
const spy = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      const href = `#${e.target.id}`;
      navLinks.forEach(a => a.classList.toggle('active', a.getAttribute('href') === href));
    }
  });
}, { rootMargin: '-25% 0px -70% 0px', threshold: 0 });

document.querySelectorAll('.section:not(#sec-generated)').forEach(s => spy.observe(s));

// ── Generator button ──────────────────────────────────────────────────────────

const genSection = document.getElementById('sec-generated');
const genGrid    = document.getElementById('grid-generated');
const navGen     = document.getElementById('nav-gen');

document.querySelector('.btn-generate').addEventListener('click', () => {
  const card = makeCard(generate(), true);
  genGrid.prepend(card);
  genSection.style.display = 'block';
  navGen.style.display     = 'block';
  requestAnimationFrame(() => fitArt(card));
  genSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
});
</script>
</body>
</html>
