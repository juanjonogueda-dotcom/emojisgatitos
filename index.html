<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emojis de Gatitos</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #f9f9f7;
      --text:     #1a1a1a;
      --muted:    #aaa;
      --dim:      #777;
      --hover:    #efefed;
      --copied:   #e6f4ea;
      --mono:     'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.6;
    }

    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 1.5rem 8rem;
    }

    header {
      text-align: center;
      padding: 5rem 0 2rem;
    }

    h1 {
      font-size: 1.45rem;
      font-weight: 500;
      letter-spacing: -0.015em;
      color: var(--text);
    }

    .tagline {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.35rem;
    }

    .tagline-sub {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 0.15rem;
      opacity: 0.75;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 1.75rem;
      margin: 1.75rem 0 0;
    }

    nav a {
      font-size: 0.75rem;
      color: var(--dim);
      text-decoration: none;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      transition: color 0.12s;
      padding-bottom: 2px;
      border-bottom: 1px solid transparent;
    }

    nav a:hover {
      color: var(--text);
      border-bottom-color: var(--text);
    }

    .generate-wrap {
      text-align: center;
      margin: 3rem 0 3.5rem;
    }

    .btn-generate {
      background: var(--text);
      color: var(--bg);
      border: none;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.03em;
      padding: 0.5rem 1.4rem;
      border-radius: 100px;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn-generate:hover  { opacity: 0.7; }
    .btn-generate:active { opacity: 0.5; }

    .section {
      margin-bottom: 3.5rem;
      scroll-margin-top: 2rem;
    }

    .section-label {
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e5e5e3;
    }

    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      align-items: flex-start;
    }

    .card {
      padding: 0.45rem 0.7rem;
      border-radius: 5px;
      cursor: pointer;
      user-select: none;
      transition: background 0.1s;
      position: relative;
    }

    .card:hover  { background: var(--hover); }
    .card.copied { background: var(--copied); }

    .card .art {
      font-family: var(--mono);
      font-size: 0.84rem;
      line-height: 1.55;
      white-space: pre;
      display: block;
      color: var(--text);
    }

    .flash {
      position: absolute;
      top: -1.3rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.58rem;
      color: #3d9142;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s;
    }

    .card.copied .flash { opacity: 1; }

    #sec-generated { display: none; }
    #nav-gen       { display: none; }

    .card.new {
      animation: pop 0.18s ease-out;
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(0.88); }
      to   { opacity: 1; transform: scale(1); }
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(26, 26, 26, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: zoom-out;
      padding: 2rem;
      animation: fade 0.15s ease-out;
    }
    .modal.open { display: flex; }

    .modal-art {
      font-family: var(--mono);
      font-size: clamp(1.4rem, 6vw, 3.2rem);
      line-height: 1.3;
      white-space: pre;
      color: #f9f9f7;
      text-align: center;
    }

    .modal-hint {
      position: absolute;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      color: rgba(249, 249, 247, 0.5);
      letter-spacing: 0.05em;
    }

    @keyframes fade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>

<div class="wrap">

  <header>
    <h1>Colección de Gatitos</h1>
    <p class="tagline">haz clic para copiar</p>
    <p class="tagline-sub">doble clic para ver en grande</p>
    <nav>
      <a href="#sec-generated" id="nav-gen">generados</a>
      <a href="#sec-kaomoji">kaomoji</a>
      <a href="#sec-ascii">ascii</a>
      <a href="#sec-braille">braille</a>
    </nav>
  </header>

  <div class="generate-wrap">
    <button class="btn-generate">generar un gatito</button>
  </div>

  <section class="section" id="sec-generated">
    <p class="section-label">generados</p>
    <div class="grid" id="grid-generated"></div>
  </section>

  <section class="section" id="sec-kaomoji">
    <p class="section-label">kaomoji</p>
    <div class="grid" id="grid-kaomoji"></div>
  </section>

  <section class="section" id="sec-ascii">
    <p class="section-label">ascii</p>
    <div class="grid" id="grid-ascii"></div>
  </section>

  <section class="section" id="sec-braille">
    <p class="section-label">braille</p>
    <div class="grid" id="grid-braille"></div>
  </section>

</div>

<div class="modal" id="modal">
  <pre class="modal-art" id="modal-art"></pre>
  <span class="modal-hint">haz clic para cerrar</span>
</div>

<script>
const data = {
  kaomoji: [
    `⦃ᐢ•ﻫ•ᐢ⦄`,`(=^･ω･^=)`,`ๅ^•ﻫ•^ๅ`,`(=^▽^=)`,`ヾ(=^･ω･^=)丿`,
    `(=^♡ω♡^=)`,`/ᐠ｡ꟈ｡ᐡ\\`,`≽^•⩊•^≼`,`(^･ω･^ )`,`(ΦωΦ)`,
    `(=\`ω´=)`,`≽^◡^≼`,`^←ᴥ←^`,`(=←ω←=)`,`(^._.^)ﾉ`,
    `/ᐠ–ꟈ–ᐡ\\`,`(=^‥^=)`,`(=^･^=)`,`ๅ(ᐢ•ﻫ•ᐢ)ๅ`,`(=^-ω-^=)`,
    `(^=◕ᴥ◕=^)`,`(=^..^=)∫`,`ๅ•ﻫ•ๅ`,`(=①ω①=)`,`(^˘ᴜ˘^)`,
    `(=^·^=)`,`(=^◡^=)`,`(=TωT=)`,`(=^ᆀ^=)`,`(=˘ᆀ˘=)`,
    `(= ; ω ; =)`,`ヽ(=^･ω･^=)丿`,`(^•ω•^)`,`/ᐠ. ᴗ .ᐡ\\`,
    `(ๅ^ω^ๅ)`,`(^o.o^)`,`(^..^)ﾉ`,`U^ェ^U`,`(=^owo^=)`,`ๅ(^•ω•^ๅ)`,
  ],

  ascii: [
    `　　　／＞　　フ\n　　　|　_　 _|\n　　／\` ミ_xノ\n　　/　　　　 |\n　/　 フ　　 ﾉ\n　│　　|　|　|\n／＾|　　|　|　|\n(＾ヽ＿_ポ_)__)\n　＼二つ`,
    `/\\_/\\\n= ( °w° ) =\n  )   (\n (__  __)`,
    ` /\\  /\\\n( o  o )\n  (∧)\n ( v )`,
    `  /\\  /\\\n =( ^ω^)=\n  )   (\n (__ __)`,
    `/\\_/\\\n( -.- )\n > ^ <\n(_____)`,
    `/\\_/\\\n( >_< )\n  ∧∧\n (   )`,
    `/\\_____/\\\n/  o   o  \\\n( ==  ^  == )\n )         (\n(           )\n(_)_______(_)`,
    `+-------+\n|  ^   ^ |\n|  (o)   |\n|   v    |\n+-------+`,
  ],

  braille: [
    `⣿⣦⡀⠀⠀⠀⠀⢀⣴⣿\n⣿⠉⣉⣉⠉⠉⣉⣉⠉⣶\n⣿⠀⠉⠉⣤⣤⠉⠉⠀⣿\n⢿⣤⣀⣉⣀⣀⣉⣀⡤⠿`,
    `⣿⣶⣤⣀⣀⣀⣀⣤⣶⣿\n⣿⠐⠒⠂⣀⣀⠒⠒⠀⣿\n⣿⣀⠀⠉⠛⠛⠀⠀⣀⣿\n⠀⠉⠉⠉⠉⠉⠉⠉⠉⠀`,
    `⣾⠷⠤⠤⠤⠤⠤⠾⣷\n⣿⠀⠛⣀⣀⣀⠛⠀⣿\n⠿⣤⣀⣀⣉⣀⣀⣤⠿`,
    `⣿⣶⣤⣀⣀⣤⣶⣿\n⣿⠰⠶⠆⠰⠶⠆⣿\n⣿⣈⠓⠒⠒⠚⣁⣿\n⠈⠉⠉⠉⠉⠉⠉⠁`,
    `⣿⠶⠤⠤⠤⠤⠶⣿\n⣿⠘⠛⣃⣀⠘⠃⣿\n⣿⣀⠀⠛⠛⠀⣀⣿\n⠈⠉⠉⠉⠉⠉⠉⠁`,
    `⣿⣶⣤⣀⣀⣀⣀⣤⣶⣿\n⣿⠐⠒⠐⠶⠶⠐⠒⠂⣿\n⣿⣀⠠⠐⠶⠶⠂⠄⣀⣿\n⠉⠉⠉⠉⠉⠉⠉⠉⠉⠉`,
  ],
};

const GEN = {
  eyes:  ['ω','▽','◡','•','‥','←','♡','･','ᴗ','o','ˇ','◕','ᵵ','^','T'],
  noses: ['ﻫ','ω','ᆀ','ᴥ','▿','~','^','◇','w','ᴜ','ꟈ'],
  wraps: [
    ['(=^','  ^=)'],['(^','^)'],['(=','=)'],
    ['≽^','^≼'],['/ᐠ','ᐡ\\'],['⦃ᐢ','ᐢ⦄'],
    ['ๅ^','^ๅ'],['≽','≼'],
  ],
};

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function generate() {
  const e = pick(GEN.eyes);
  const n = pick(GEN.noses);
  const [l, r] = pick(GEN.wraps);
  return `${l}${e}${n}${e}${r}`;
}

const modal = document.getElementById('modal');
const modalArt = document.getElementById('modal-art');

function openModal(text) {
  modalArt.textContent = text;
  modal.classList.add('open');
}
function closeModal() {
  modal.classList.remove('open');
}
modal.addEventListener('click', closeModal);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

function copyText(text, card) {
  navigator.clipboard.writeText(text).catch(() => {
    const ta = Object.assign(document.createElement('textarea'), {
      value: text, style: 'position:fixed;opacity:0'
    });
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  });
  document.querySelectorAll('.card.copied').forEach(c => c.classList.remove('copied'));
  card.classList.add('copied');
  setTimeout(() => card.classList.remove('copied'), 1200);
}

function makeCard(text, animate = false) {
  const card = document.createElement('div');
  card.className = 'card' + (animate ? ' new' : '');

  const flash = document.createElement('span');
  flash.className = 'flash';
  flash.textContent = '¡copiado!';

  const art = document.createElement('span');
  art.className = 'art';
  art.textContent = text;

  card.append(flash, art);

  let clickTimer = null;
  card.addEventListener('click', () => {
    if (clickTimer) {
      clearTimeout(clickTimer);
      clickTimer = null;
      openModal(text);
    } else {
      clickTimer = setTimeout(() => {
        clickTimer = null;
        copyText(text, card);
      }, 240);
    }
  });

  return card;
}

function render(key, gridId) {
  const grid = document.getElementById(gridId);
  data[key].forEach(t => grid.appendChild(makeCard(t)));
}

render('kaomoji', 'grid-kaomoji');
render('ascii',   'grid-ascii');
render('braille', 'grid-braille');

const genSection = document.getElementById('sec-generated');
const genGrid    = document.getElementById('grid-generated');
const navGen     = document.getElementById('nav-gen');

document.querySelector('.btn-generate').addEventListener('click', () => {
  const card = makeCard(generate(), true);
  genGrid.prepend(card);
  genSection.style.display = 'block';
  navGen.style.display = 'block';
  genSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
});
</script>
</body>
</html>
