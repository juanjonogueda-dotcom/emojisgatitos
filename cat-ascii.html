<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat Collection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:            #f6f1ea;
      --bg-alt:        #ede7dc;
      --surface:       #f0ebe2;
      --surface-hover: #e8e0d4;
      --border:        #d8cfc2;
      --border-hover:  #c2b49e;
      --text:          #2b1d0e;
      --text-mid:      #6b5030;
      --text-muted:    #a8906f;
      --accent:        #7a5230;
      --accent-light:  #c49a6c;
      --copy-bg:       rgba(122, 82, 48, 0.12);
      --copy-border:   rgba(122, 82, 48, 0.55);
      --sidebar-w:     220px;
    }

    html {
      background: var(--bg);
      color: var(--text);
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Lora', Georgia, 'Times New Roman', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Page shell ── */
    .page {
      display: flex;
      align-items: flex-start;
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
      padding: 0 1.5rem;
      gap: 2.5rem;
    }

    /* ── Main ── */
    main {
      flex: 1;
      min-width: 0;
      padding: 3.5rem 0 8rem;
    }

    /* ── Header ── */
    header {
      margin-bottom: 3rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 500;
      letter-spacing: -0.025em;
      color: var(--text);
      line-height: 1.2;
      font-style: italic;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-style: normal;
      font-weight: 400;
      margin-top: 0.4rem;
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── Sections ── */
    .section {
      margin-bottom: 3.5rem;
    }

    .section-title {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-style: normal;
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 1.1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .section-count {
      font-size: 0.65rem;
      color: var(--border-hover);
      font-weight: 400;
    }

    /* ── Grid ── */
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: flex-start;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.9rem 1.1rem;
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s, transform 0.08s;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      flex: 0 0 auto;
    }

    .card:hover {
      background: var(--surface-hover);
      border-color: var(--border-hover);
    }

    .card:active { transform: scale(0.96); }

    .card.copied {
      border-color: var(--copy-border) !important;
      background: var(--copy-bg) !important;
    }

    .card.generated {
      border-style: dashed;
      border-color: var(--accent-light);
    }

    .card pre,
    .card .art {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.88rem;
      line-height: 1.55;
      white-space: pre;
      text-align: left;
      color: var(--text);
    }

    .card .art { font-size: 1.15rem; }

    .copied-label {
      position: absolute;
      top: 0.35rem;
      right: 0.55rem;
      font-size: 0.58rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
      opacity: 0;
      transition: opacity 0.12s;
      pointer-events: none;
    }

    .card.copied .copied-label { opacity: 1; }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      position: sticky;
      top: 3.5rem;
      padding: 3.5rem 0 3rem;
      align-self: flex-start;
    }

    .sidebar-inner {
      border-left: 1px solid var(--border);
      padding-left: 1.5rem;
    }

    .sidebar-label {
      font-size: 0.62rem;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      margin-bottom: 2rem;
    }

    .nav-item a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
      padding: 0.3rem 0;
      transition: color 0.12s;
      border-left: 2px solid transparent;
      margin-left: -1.5rem;
      padding-left: 1.35rem;
    }

    .nav-item a:hover { color: var(--text-mid); }

    .nav-item.active a {
      color: var(--accent);
      border-left-color: var(--accent);
    }

    .nav-count {
      font-size: 0.6rem;
      color: var(--border-hover);
    }

    .btn-generate {
      width: 100%;
      background: var(--text);
      border: none;
      color: var(--bg);
      font-family: 'Lora', serif;
      font-size: 0.82rem;
      font-style: italic;
      padding: 0.6rem 1rem;
      border-radius: 5px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.08s;
      text-align: center;
    }

    .btn-generate:hover { opacity: 0.85; }
    .btn-generate:active { transform: scale(0.97); }

    .generate-hint {
      font-size: 0.6rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      margin-top: 0.5rem;
      text-align: center;
      line-height: 1.5;
    }

    /* ── Section scroll highlight ── */
    .section-title.active-section {
      color: var(--accent);
    }

    /* ── Responsive ── */
    @media (max-width: 700px) {
      .sidebar { display: none; }
      .page { padding: 0 1rem; }
    }
  </style>
</head>
<body>

  </main>

  <aside class="sidebar">

        <li class="nav-item" data-target="sec-braille">

        </li>

// ── Generator ────────────────────────────────────────────────────────────────

const GEN = {
  eyes: ['ω','▽','◡','•','‥','ↀ','♡','･','ᴗ','o','ˇ','˘','◕','ᵕ','^','T','>' ],
  noses: ['ﻌ','ω','ᆽ','ᴥ','▿','∧','~','^','◇','w','ᗜ','ꞈ'],
  wrappers: [
    ['(=^','  ^=)'],['(^',  '^)'],['(=',  '=)'],
    ['≽^',  '^≼'], ['/ᐠ',  'ᐟ\\'],['₍ᐢ', 'ᐢ₎'],
    ['ฅ^',  '^ฅ'], ['(ΦωΦ',''],   ['≽',   '≼'],
  ],
  pre:  ['','','','ฅ','ヾ','ヽ','(╯'],
  suf:  ['','','','ฅ','ﾉ','丿','∫'],
};

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function generateKaomoji() {
  const e = pick(GEN.eyes);
  const n = pick(GEN.noses);
  const [wl, wr] = pick(GEN.wrappers);
  // some wrappers already contain both sides
  if (!wr) {
    return `${wl}${e}${n}${e})`;
  }
  const pre = Math.random() < 0.25 ? pick(GEN.pre.filter(Boolean)) : '';
  const suf = Math.random() < 0.25 ? pick(GEN.suf.filter(Boolean)) : '';
  return `${pre}${wl}${e}${n}${e}${wr}${suf}`;
}

function generateSimpleAscii() {
  const tops = ['  /\\  /\\','  ∧  ∧','  /\\  /\\'];
  const eyeRow = pick([
    '( •  • )','( o  o )','( ^  ^ )','( ◕  ◕ )','( -  - )','( >  < )',
  ]);
  const nose = pick([' (∧) ',' (ω) ',' (^) ',' (~) ']);
  const bot  = pick([' ( v )',' (_v_)',' (___)',' >^< ']);
  return `${pick(tops)}\n${eyeRow}\n${nose}\n${bot}`;
}

function generateCat() {
  return Math.random() < 0.75 ? generateKaomoji() : generateSimpleAscii();
}

// ── Render ───────────────────────────────────────────────────────────────────

function makeCard(artText, extra = '') {
  const card = document.createElement('div');
  card.className = `card${extra ? ' ' + extra : ''}`;

  const copied = document.createElement('span');
  copied.className = 'copied-label';
  copied.textContent = 'copied!';

  const isMulti = artText.includes('\n');
  const el = document.createElement(isMulti ? 'pre' : 'div');
  el.className = isMulti ? '' : 'art';
  el.textContent = artText;

  card.appendChild(copied);
  card.appendChild(el);

  card.addEventListener('click', () => {
    navigator.clipboard.writeText(artText).catch(() => {
      const ta = Object.assign(document.createElement('textarea'), {
        value: artText, style: 'position:fixed;opacity:0'
      });
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    });
    document.querySelectorAll('.card.copied').forEach(c => c.classList.remove('copied'));
    card.classList.add('copied');
    setTimeout(() => card.classList.remove('copied'), 1100);
  });

  return card;
}

function renderSection(category) {
  const grid  = document.getElementById(`grid-${category}`);
  const count = document.getElementById(`count-${category}`);
  const navCt = document.getElementById(`nav-count-${category}`);
  const items = cats[category];
  items.forEach(art => grid.appendChild(makeCard(art)));
  const n = items.length;
  count.textContent = n;
  if (navCt) navCt.textContent = n;
}

['kaomoji','ascii-art','braille','emoji'].forEach(renderSection);

// ── Generate button ───────────────────────────────────────────────────────────

const genSection = document.getElementById('sec-generated');
const genGrid    = document.getElementById('grid-generated');
const genCount   = document.getElementById('gen-count');
let genN = 0;

document.querySelector('.btn-generate').addEventListener('click', () => {
  const art  = generateCat();
  const card = makeCard(art, 'generated');

  // Prepend with small pop animation
  card.style.opacity = '0';
  card.style.transform = 'scale(0.85)';
  genGrid.prepend(card);
  requestAnimationFrame(() => {
    card.style.transition = 'opacity 0.2s ease, transform 0.2s ease';
    card.style.opacity = '1';
    card.style.transform = 'scale(1)';
  });

  genN++;
  genCount.textContent = genN;
  genSection.style.display = '';

  // Scroll into view
  genSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

// ── Sidebar scroll spy ────────────────────────────────────────────────────────

const sections = ['kaomoji','ascii-art','braille','emoji'];
const navItems = document.querySelectorAll('.nav-item');

const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (!entry.isIntersecting) return;
    const id = entry.target.id.replace('sec-', '');
    navItems.forEach(ni => {
      ni.classList.toggle('active', ni.dataset.target === `sec-${id}`);
    });
  });
}, { rootMargin: '-30% 0px -60% 0px' });

sections.forEach(s => {
  const el = document.getElementById(`sec-${s}`);
  if (el) observer.observe(el);
});
</script>
</body>
</html>
